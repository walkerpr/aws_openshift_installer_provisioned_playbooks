---

- name: Install HAProxy
  package:
    name: haproxy
    state: present

- name: Configure HAProxy
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode:  0644
  notify:
    - Restart HAProxy

- name: Enable and start HAProxy
  systemd:
    name: haproxy
    state: started
    enabled: true

