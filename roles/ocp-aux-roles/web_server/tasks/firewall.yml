---
- name: Ensure firewalld is installed
  ansible.builtin.package:
    name: firewalld
    state: present

- name: Enable and start firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

# We should eventually use https

- name: Allow http protocol
  ansible.posix.firewalld:
    service: http
    immediate: true
    permanent: true
    state: enabled
