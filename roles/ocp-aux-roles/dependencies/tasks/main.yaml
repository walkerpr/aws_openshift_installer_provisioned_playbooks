---
- name: Get ssh key id
  changed_when: keyId.rc != 0
  ansible.builtin.command: >
    aws ssm get-parameter --name /sample/ec2/sample-central-services/ec2/default-key/id --query Parameter.Value --with-decryption --output=text
  register: keyId

- name: Get ssh key
  changed_when: sshKey.rc != 0
  ansible.builtin.command: >
    aws ssm get-parameter --name /ec2/keypair/{{ keyId.stdout }} --query Parameter.Value --with-decryption --output=text
  register: sshKey

- name: Template ssh key.
  ansible.builtin.template:
    src: templates/ssh.j2
    dest: "{{ ansible_ssh_private_key_file }}"
    mode: "700"
