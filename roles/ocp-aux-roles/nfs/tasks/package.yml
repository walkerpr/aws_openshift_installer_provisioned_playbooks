---

- name: create aws dir
  file:
    path: "~/.aws/"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode:  0755

- name: Create config file for AWS
  template:
    src:  aws_config.yaml.j2
    dest: "~/.aws/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode:  0640

- name: Install NFS utilities
  command: dnf install -y nfs-utils
  become: true

- name: Enable and start nfs-server
  systemd:
    name: nfs-server
    state: started
    enabled: true
  become: true

- name: Enable and start rpcbind
  systemd:
    name: rpcbind
    state: started
    enabled: true
  become: true

- name: Install boto3
  pip:
    name: boto3

- name: Install botocore
  pip:
    name: botocore