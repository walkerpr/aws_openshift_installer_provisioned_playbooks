---
- name: Create aws dir
  ansible.builtin.file:
    path: "~/.aws/"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create config file for AWS
  ansible.builtin.template:
    src: aws_config.yaml.j2
    dest: "~/.aws/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"

- name: Install NFS utilities
  register: my_output
  changed_when: my_output.rc != 0
  ansible.builtin.command: dnf install -y nfs-utils
  become: true

- name: Enable and start nfs-server
  ansible.builtin.systemd:
    name: nfs-server
    state: started
    enabled: true
  become: true

- name: Enable and start rpcbind
  ansible.builtin.systemd:
    name: rpcbind
    state: started
    enabled: true
  become: true

- name: Install boto3
  ansible.builtin.pip:
    name: boto3

- name: Install botocore
  ansible.builtin.pip:
    name: botocore
