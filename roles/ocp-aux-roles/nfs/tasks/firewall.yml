---
- name: Ensure firewalld is installed
  ansible.builtin.package:
    name: firewalld
    state: present

- name: Ensure firewalld is enabled and started
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Allow NFS traffic
  ansible.posix.firewalld:
    service: nfs
    immediate: true
    permanent: true
    state: enabled
