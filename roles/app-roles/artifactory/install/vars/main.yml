---

# Registry and repository prefix where App sample images are stored
pull_repository: "{{ ocp_registry_endpoint }}/application-sample"

# FQDN of App sample
sample_fqdn: "{{ sample_name }}.{{ apps_base_domain }}"

# Certificate alias of App sample
server_alias: "{{ sample_fqdn }}"

# Certificate alias of security server
idp_alias: "{{ groups.am[0] }}"


artifactory_configmap_manifest:          "manifests/core/configmap/artifactory.yml.j2"

artifactory_service_manifest:            "manifests/core/service/artifactory.yml.j2"

artifactorydb_service_manifest:          "manifests/core/service/artifactorydb.yml.j2"

artifactory_deploymentconfig_manifest:   "manifests/apps.openshift.io/deploymentconfig/artifactory.yml.j2"

artifactorydb_deploymentconfig_manifest: "manifests/apps.openshift.io/deploymentconfig/artifactorydb.yml.j2"
