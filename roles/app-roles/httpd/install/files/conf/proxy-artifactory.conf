<IfModule mod_proxy.c>

    #As opposed to defining these here we could leave them as env vars passed to the container
    define INTERNAL_HOST artifactory
    define INTERNAL_PORT_1 8081
    define INTERNAL_PORT_2 8082

    ProxyPreserveHost On

    ServerName ${PROXY_HOST}
    #ServerAlias *.${PROXY_HOST}
    ServerAdmin server@admin

    ## Application specific logs
    ## ErrorLog ${APACHE_LOG_DIR}/${PROXY_HOST}-error.log
    ## CustomLog ${APACHE_LOG_DIR}/${PROXY_HOST}-access.log combined

    AllowEncodedSlashes On
    RewriteEngine on

    RewriteCond %{SERVER_PORT} (.*)
    RewriteRule (.*) - [E=my_server_port:%1]
    ##  NOTE: The 'REQUEST_SCHEME' Header is supported only from apache version 2.4 and above
    RewriteCond %{REQUEST_SCHEME} (.*)
    RewriteRule (.*) - [E=my_scheme:%1]

    RewriteCond %{HTTP_HOST} (.*)
    RewriteRule (.*) - [E=my_custom_host:%1]

    RewriteCond "%{REQUEST_URI}" "^/(v1|v2)/"
    RewriteRule "^/(v1|v2)/(.*)$" "/artifactory/api/docker/${DOCKER_PUSH_REPO}/$1/$2" [PT]

    RewriteRule ^/artifactory(/)?$      /artifactory/webapp/ [R,L]
    RewriteRule ^/artifactory/webapp$   /artifactory/webapp/ [R,L]

    RequestHeader set Host %{my_custom_host}e
    RequestHeader set X-Forwarded-Port %{my_server_port}e
    ## NOTE: {my_scheme} requires a module which is supported only from apache version 2.4 and above
    RequestHeader set X-Forwarded-Proto %{my_scheme}e
    RequestHeader set X-Artifactory-Override-Base-Url %{my_scheme}e://${PROXY_HOST}:%{my_server_port}e/artifactory
    ProxyPassReverseCookiePath /artifactory /artifactory
    Header set X-Frame-Options "ALLOW-FROM https://${PROXY_HOST}/owf"

    ProxyRequests off
    ProxyPreserveHost on

    ProxyPass /artifactory/ http://${INTERNAL_HOST}:${INTERNAL_PORT_1}/artifactory/
    ProxyPassReverse /artifactory/ http://${INTERNAL_HOST}:${INTERNAL_PORT_1}/artifactory/

    ProxyPass /ui/ http://${INTERNAL_HOST}:${INTERNAL_PORT_2}/ui/
    ProxyPassReverse /ui/ http://${INTERNAL_HOST}:${INTERNAL_PORT_2}/ui/
</IfModule>

