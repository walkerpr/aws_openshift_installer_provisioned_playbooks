---

# Registry and repository prefix where App sample images are stored
pull_repository: "{{ ocp_registry_endpoint }}/application-sample"

# FQDN of App sample
sample_fqdn: "{{ sample_name }}.{{ apps_base_domain }}"

# Certificate alias of App sample
server_alias: "{{ sample_fqdn }}"

# Certificate alias of security server
idp_alias: "{{ groups.am[0] }}"

proxy_host: "{{ sample_fqdn }}"


httpd_configmap_manifest:        "manifests/core/configmap/httpd.yml.j2"

httpd_service_manifest:          "manifests/core/service/httpd.yml.j2"

httpd_deploymentconfig_manifest: "manifests/apps.openshift.io/deploymentconfig/httpd.yml.j2"

httpd_route_manifest:            "manifests/route.openshift.io/route/httpd.yml.j2"
