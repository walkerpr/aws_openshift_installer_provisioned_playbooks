---

# Registry and repository prefix where App sample images are stored
pull_repository: "{{ ocp_registry_endpoint }}/application-sample"

# FQDN of App sample
sample_fqdn: "{{ sample_name }}.{{ apps_base_domain }}"

# Certificate alias of App sample
server_alias: "{{ sample_fqdn }}"

# Certificate alias of security server
idp_alias: "{{ groups.am[0] }}"


marketplace_service_manifest:            "manifests/core/service/marketplace.yml.j2"

marketplacedb_service_manifest:          "manifests/core/service/marketplacedb.yml.j2"

marketplace_deploymentconfig_manifest:   "manifests/apps.openshift.io/deploymentconfig/marketplace.yml.j2"

marketplacedb_deploymentconfig_manifest: "manifests/apps.openshift.io/deploymentconfig/marketplacedb.yml.j2"
