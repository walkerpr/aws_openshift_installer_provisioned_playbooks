---

- name: Get cluster image configuration
  k8s_info:
    api_version: config.openshift.io/v1
    kind: Image
    name: cluster
  register: image_result

- name: Configure allowed registries
  k8s:
    definition:
      apiVersion: config.openshift.io/v1
      kind: Image
      metadata:
        name: cluster
      spec:
        registrySources:
          allowedRegistries: "{{ desired_allowed_registries }}"
    state: present

