---

- name: Create installmanager database deployment config
  k8s:
    definition: "{{ lookup('template', installmanagerdb_deploymentconfig_manifest) }}"

- name: Ensure installmanager database pod is running (2m)
  k8s_info:
    kind: Pod
    namespace: application-sample
    field_selectors:
      - status.phase=Running
    label_selectors:
      - app=installmanagerdb
  register: pod_result
  until: pod_result.resources | count > 0
  delay: 10
  retries: 12

- name: Create installmanager deployment config
  k8s:
    definition: "{{ lookup('template', installmanager_deploymentconfig_manifest) }}"

