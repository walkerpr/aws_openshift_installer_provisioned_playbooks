- name: Disable EBS as default
  kubernetes.core.k8s:
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: gp3-csi
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"

- name: Create NFS storage class
  kubernetes.core.k8s:
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: file
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
      provisioner: kubernetes.io/no-provisioner
    state: present

- name: Configure NFS persistent volumes
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: "{{ item.name }}"
      spec:
        accessModes:
          - ReadWriteMany
        capacity:
          storage: "{{ item.size }}"
        nfs:
          path: "/mnt/nfs/deployment{{ deployment_number }}/{{ item.name }}"
          server: "nfs.dev.sample.dev"
        persistentVolumeReclaimPolicy: Retain
        storageClassName: file
    state: present
  loop: "{{ ocp4_nfs_volumes }}"

