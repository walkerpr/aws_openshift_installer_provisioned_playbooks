---
- name: Get subnet 0
  amazon.aws.ec2_vpc_subnet_info:
    filters:
      "tag:Name": sample-deployment-{{ deployment_number }}-subnet-0
  register: subnet_info_0

- name: Get subnet 1
  amazon.aws.ec2_vpc_subnet_info:
    filters:
      "tag:Name": sample-deployment-{{ deployment_number }}-subnet-1
  register: subnet_info_1

- name: Create operator group
  kubernetes.core.k8s:
    namespace: openshift-cluster-csi-drivers
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: openshift-cluster-csi-drivers-operator-group
    state: present

- name: Apply EFS operator subscription
  kubernetes.core.k8s:
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: aws-efs-csi-driver-operator
        namespace: openshift-cluster-csi-drivers
        labels:
          operators.coreos.com/aws-efs-csi-driver-operator.openshift-cluster-csi-drivers: ""
      spec:
        channel: stable
        installPlanApproval: Automatic
        name: aws-efs-csi-driver-operator
        source: redhat-operators
        sourceNamespace: openshift-marketplace
    apply: true

- name: Apply EFS operator driver
  kubernetes.core.k8s:
    definition:
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: efs.csi.aws.com
      spec:
        managementState: Managed
    apply: true

- name: Ensure EFS operator pod is running
  kubernetes.core.k8s_info:
    kind: pod
    namespace: openshift-cluster-csi-drivers
    field_selectors:
      - status.phase=Running
    label_selectors:
      - app=aws-efs-csi-driver-operator
  register: pod_result
  until: pod_result.resources | default([]) | count > 0
  delay: 30
  retries: 20

