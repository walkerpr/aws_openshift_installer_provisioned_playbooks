---

- name: Create operator group
  k8s:
    namespace: openshift-distributed-tracing
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: jaeger-operator-group
    state: present

- name: Install openshift jaeger operator
  k8s:
    namespace: openshift-distributed-tracing
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: servicemeshoperator
        namespace: openshift-distributed-tracing
      spec:
        channel: "{{ subscription_channel }}"
        installPlanApproval: "{{ subscription_approval }}"
        name: jaeger-product
        source: redhat-operators
        sourceNamespace: openshift-marketplace
    state: present

- name: Ensure jaeger operator pod is running
  k8s_info:
    kind: pod
    namespace: openshift-distributed-tracing
    field_selectors:
      - status.phase=Running
    label_selectors:
      - name=jaeger-operator
  register: pod_result
  until: pod_result.resources | default([]) | count > 0
  delay: 30
  retries: 20