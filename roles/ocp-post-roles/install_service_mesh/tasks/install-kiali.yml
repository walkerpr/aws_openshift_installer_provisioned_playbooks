---

- name: Install openshift kiali operator
  k8s:
    namespace: openshift-operators
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: kiali-ossm
        namespace: openshift-operators
      spec:
        channel: "{{ subscription_channel }}"
        installPlanApproval: "{{ subscription_approval }}"
        name: kiali-ossm
        source: redhat-operators
        sourceNamespace: openshift-marketplace
    state: present

- name: Ensure kiali operator pod is running
  k8s_info:
    kind: pod
    namespace: openshift-operators
    field_selectors:
      - status.phase=Running
    label_selectors:
      - name=kiali-operator
  register: pod_result
  until: pod_result.resources | default([]) | count > 0
  delay: 30
  retries: 20